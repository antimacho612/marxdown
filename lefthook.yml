# 05.performance-budget.md §5.5 の「全 PR / コミット」で回すものだけをここに置く。
# 起動時間とメモリは環境ノイズが大きいため hook には載せない（マイルストーンごとの手動計測）。
pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: '*.{ts,js,mjs,svelte,css,json,jsonc,yml,html}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    - name: eslint
      glob: '*.{ts,js,mjs,svelte}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    - name: rustfmt
      glob: '*.rs'
      root: src-tauri/
      run: cargo fmt -- --check

pre-push:
  parallel: true
  jobs:
    - name: tsc
      run: pnpm exec tsc --noEmit
    - name: svelte-check
      run: pnpm exec svelte-check --threshold error
    - name: vitest
      run: pnpm exec vitest run
    - name: clippy
      root: src-tauri/
      run: cargo clippy --all-targets -- -D warnings
