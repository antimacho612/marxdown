<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 72" width="256" height="72" role="img" aria-label="Marxdown">
  <!--
    README 用の横組みロゴ（明 背景向け）。
    形のマスターは `src-tauri/icons/source.svg`。形を直したらここも直す。

    GitHub の README はライト / ダークで地色が変わるので、
    ワードマークの色が片方で読めなくなる。`<picture>` で 2 枚出し分けている。
    SVG 内部の prefers-color-scheme は <img> 経由だと効かない環境がある。

    マークは透過版。台座版（`source-plate.svg`）はこの表示サイズ（高さ 46px）では中身が潰れる。

    ワードマークは <text> のまま置いてある。アウトライン化していないので、
    環境によって字形と幅が変わる。厳密な再現が要る用途では使わないこと。
  -->
  <defs>
    <clipPath id="cw"><rect x="-64" y="-64" width="192" height="384" /></clipPath>
    <clipPath id="ce"><rect x="128" y="-64" width="192" height="384" /></clipPath>
    <linearGradient id="b" gradientUnits="userSpaceOnUse" x1="48" y1="54" x2="112" y2="206">
      <stop offset="0" stop-color="#8e9dff" />
      <stop offset="0.45" stop-color="#5566ee" />
      <stop offset="1" stop-color="#2f35b4" />
    </linearGradient>
    <linearGradient id="r" gradientUnits="userSpaceOnUse" x1="146" y1="62" x2="212" y2="208">
      <stop offset="0" stop-color="#ff8fa8" />
      <stop offset="0.45" stop-color="#f2506a" />
      <stop offset="1" stop-color="#b81c46" />
    </linearGradient>
    <linearGradient id="y" x1="0.14" y1="0.02" x2="0.86" y2="0.98">
      <stop offset="0" stop-color="#ffe9a3" />
      <stop offset="0.5" stop-color="#ffc44a" />
      <stop offset="1" stop-color="#e8940e" />
    </linearGradient>
  </defs>

  <!-- 0.276 = 46 / 166.66（マークの実描画高）。左端に高さ 46 で置く -->
  <g transform="translate(0 13) scale(0.276) translate(-31.53 -41.67)">
    <g fill="none" stroke-width="42.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M58.75 184.55 L58.75 68.89 L158 214.33" stroke="url(#b)" clip-path="url(#cw)" />
      <path d="M197.25 184.55 L197.25 68.89 L98 214.33" stroke="url(#r)" clip-path="url(#ce)" />
    </g>
    <circle cx="58.75" cy="68.89" r="27.22" fill="url(#y)" />
    <circle cx="197.25" cy="68.89" r="21.4" fill="url(#y)" />
  </g>

  <text
    x="61"
    y="50"
    font-family="'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="38"
    font-weight="650"
    letter-spacing="-0.4"
    fill="#1c2024"
  >Marxdown</text>
</svg>
