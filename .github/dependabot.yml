# 更新の PR は月 1 回にまとめる。
# これらの PR では CI を走らせない（ci.yml）。
# 依存の更新はバンドル予算と第三者ライセンスの一覧に影響するため、取り込む前に手元で `pnpm size` と一覧の再生成を行う。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
