name: 機能の要望
description: 新しい機能や改善を提案する
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Marxdown は Markdown を「開いて・読んで・少し直す」ためのアプリです。
        IDE やナレッジ管理ツールのような方向の機能は、採用しないことがあります。
  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: どんな場面で、何ができなくて困っているかを書いてください。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 考えている解決策
  - type: textarea
    id: alternatives
    attributes:
      label: 今はどうしているか
      description: 回避策や、ほかのアプリで代わりにしていることがあれば書いてください。
