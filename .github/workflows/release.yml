name: Release

# `v*` のタグから配布物を作り、下書きの Release に載せる。
# 公開は人が行う。
# updater は `releases/latest` を見ており、下書きのあいだは利用者に届かない。
#
# macOS / Linux はプレビューの間、pre-release（版に `-` を含むタグ）にだけ載せる（ADR-0028 §3.8）。
# 安定版のタグでは Windows だけを作り、`latest.json` にも Windows の分しか載らない。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: 版の確認
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # タグは main のコミットにだけ打つ。develop で確かめてから main へ取り込む運用のため。
      - name: タグが main にあるか
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # タグと package.json / Cargo.toml / Cargo.lock / CHANGELOG / 公開鍵のずれは、ビルドする前に止める。
      - name: 版の番号
        run: node scripts/release.mjs check "$GITHUB_REF_NAME"

      - name: pre-release か
        id: kind
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: テスト
        run: pnpm exec vitest run

      - name: テスト (Rust)
        working-directory: src-tauri
        run: cargo test

      # updater 用の署名は `tauri.release.conf.json` を重ねたときだけ作る。
      # `tauri.conf.json` に置くと、秘密鍵を持たない手元の `pnpm build` が失敗する。
      - name: ビルド
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json

      # 予算を超えた版は配らない。
      - name: バンドル予算
        run: pnpm exec size-limit

      - name: latest.json
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle=src-tauri/target/release/bundle/nsis
          node scripts/release.mjs manifest "$version" "$bundle" latest.json
          mkdir -p out
          cp "$bundle/Marxdown_${version}_x64-setup.exe" "$bundle/Marxdown_${version}_x64-setup.exe.sig" latest.json out/

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  # macOS はプレビューの間、updater を使わない（M10 §4.10 の案 1）。
  # 署名鍵を渡さず、updater の成果物も作らない。
  macos:
    name: macOS (${{ matrix.arch }})
    needs: check
    if: needs.check.outputs.prerelease == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: ビルド
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg

      - uses: actions/upload-artifact@v5
        with:
          name: macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # 古い glibc の環境でも AppImage が動くよう、配布する中で最も古い LTS で作る（M10 §4.11）。
  linux:
    name: Linux
    needs: check
    if: needs.check.outputs.prerelease == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Tauri が Linux で要求するシステムライブラリ（WebKitGTK、トレイ、ダイアログ）。
      # CONTRIBUTING の一覧と揃える。
      - name: 依存ライブラリ
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # linuxdeploy は AppImage であり、ランナーに FUSE が無くても展開して動かす。
      - name: ビルド
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: pnpm tauri build --bundles deb,appimage

      # NOTE: upload-artifact に複数のパスを渡すと共通の親（`bundle/`）からの相対で格納され、`deb/` と `appimage/` が残る。
      # Release の下書きで `artifacts/*` にディレクトリが渡って失敗するため、1 つのディレクトリに集める（v0.4.0-beta.1 で発生）。
      - name: 配布物を集める
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage out/

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  release:
    name: Release の下書き
    needs: [check, windows, macos, linux]
    # pre-release でないタグでは macOS / Linux のジョブが飛ばされる。
    # 飛ばされたことは失敗ではない。
    if: >-
      always() &&
      needs.windows.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.macos.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.linux.result)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Release の下書き
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release.mjs notes "$version" > notes.md

          prerelease=()
          if [[ "$PRERELEASE" == "true" ]]; then prerelease=(--prerelease); fi

          gh release create "$GITHUB_REF_NAME" \
            --draft "${prerelease[@]}" \
            --title "Marxdown v$version" \
            --notes-file notes.md \
            artifacts/*
