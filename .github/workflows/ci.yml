name: CI

# 性能予算のうち、全 PR とコミットで検証するものだけをここに置く。
# 起動時間とメモリは環境ノイズが大きく CI での自動判定に向かないため、手動計測とする。

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dependabot の PR では各ジョブを飛ばす。
# 判定は PR の作成者で行う。`github.actor` だと、人が再実行やプッシュをしたときに対象から外れてしまう。
# develop へのマージ後は push で検証される。

jobs:
  frontend:
    name: フロントエンド
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm exec eslint .

      - name: Format (Prettier)
        run: pnpm exec prettier --check .

      - name: 型チェック
        run: pnpm exec tsc --noEmit

      # `.svelte` は tsc が読まない。型の網を通すにはこちらが要る。
      - name: 型チェック (Svelte)
        run: pnpm exec svelte-check --threshold error

      - name: テスト
        run: pnpm exec vitest run

      - name: ビルド
        run: pnpm exec vite build

      # 紹介サイトは main へのマージで公開される（pages.yml）。壊れたまま main に入らないよう、ここでも作る。
      - name: ビルド (紹介サイト)
        run: pnpm site:build

      # 依存を増やしたのに一覧を作り直していないと落ちる。
      # クレートのライセンス文を読むため、先にソースを取得しておく。
      - name: 第三者ライセンスの一覧
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          node scripts/gen-third-party-notices.mjs --check

      # 予算超過はビルドを失敗させる。
      # 超えたときに上限を引き上げてはいけない。
      # 何かを遅延チャンクに追い出すか、依存を減らすか、機能を諦める。
      - name: バンドル予算
        run: pnpm exec size-limit

  rust:
    name: Rust Core
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: windows-latest # Windows 第一優先（Design Brief §12）
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 整形
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: テスト
        working-directory: src-tauri
        run: cargo test

  # macOS / Linux はビルドできる状態を保つだけで、配布はしない（F-OS-07 / N-CMP-04）。
  # Windows 専用のコードが他のプラットフォームのビルドを壊していないかを、コンパイルとテストで確かめる。
  rust-other-platforms:
    name: Rust Core (${{ matrix.os }})
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri が Linux で要求するシステムライブラリ（WebKitGTK、トレイ、ダイアログ）。
      - name: 依存ライブラリ (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: テスト
        working-directory: src-tauri
        run: cargo test
