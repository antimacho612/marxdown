name: CI

# 性能予算のうち、全 PR とコミットで検証するものだけをここに置く。
# 起動時間とメモリは環境ノイズが大きく CI での自動判定に向かないため、手動計測とする。

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: フロントエンド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm exec eslint .

      - name: Format (Prettier)
        run: pnpm exec prettier --check .

      - name: 型チェック
        run: pnpm exec tsc --noEmit

      # `.svelte` は tsc が読まない。型の網を通すにはこちらが要る。
      - name: 型チェック (Svelte)
        run: pnpm exec svelte-check --threshold error

      - name: テスト
        run: pnpm exec vitest run

      - name: ビルド
        run: pnpm exec vite build

      # 紹介サイトは main へのマージで公開される（pages.yml）。壊れたまま main に入らないよう、ここでも作る。
      - name: ビルド (紹介サイト)
        run: pnpm site:build

      # 依存を増やしたのに一覧を作り直していないと落ちる。
      # クレートのライセンス文を読むため、先にソースを取得しておく。
      - name: 第三者ライセンスの一覧
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          node scripts/gen-third-party-notices.mjs --check

      # 予算超過はビルドを失敗させる。
      # 超えたときに上限を引き上げてはいけない。
      # 何かを遅延チャンクに追い出すか、依存を減らすか、機能を諦める。
      - name: バンドル予算
        run: pnpm exec size-limit

  rust:
    name: Rust Core
    runs-on: windows-latest # Windows 第一優先（Design Brief §12）
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 整形
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: テスト
        working-directory: src-tauri
        run: cargo test

  # macOS / Linux のコンパイルとテスト（ADR-0028）。
  # OS ごとの分岐（`cfg`）が他のプラットフォームのビルドを壊していないかを、毎回確かめる。
  rust-other-platforms:
    name: Rust Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Tauri が Linux で要求するシステムライブラリ（WebKitGTK、トレイ、ダイアログ）。
      - name: 依存ライブラリ (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: テスト
        working-directory: src-tauri
        run: cargo test

  # 配布物を作れるか（M10 §4.11）。
  # macOS のランナーは単価が高いため、手動実行と版上げの PR（`release/*`）のときだけ走らせる。
  # 作るだけで、署名も公開もしない。
  # TODO: `ccr-6d0969fc-a7sd1b` は M10 の PR で一度だけ確かめるための条件である。結果を見たら外す。
  bundle:
    name: 配布物 (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'release/') ||
      github.head_ref == 'ccr-6d0969fc-a7sd1b'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: 依存ライブラリ (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: ビルド
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v5
        with:
          name: bundle-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
