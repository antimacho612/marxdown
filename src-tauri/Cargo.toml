[package]
name = "marxdown"
version = "0.3.0"
description = "Markdown を見る・書くなら、これ。"
authors = ["antimacho612"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "marxdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: ローカル画像を asset URL 経由で表示する（F-VIEW-08 / N-SEC-05）
# tray-icon: タスクトレイ常駐（F-OS-08 / ADR-0007）。
#   `tauri-plugin-autostart` は入れない。
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
# ファイル選択ダイアログ（F-OPEN-07）。
# JS 側の `@tauri-apps/plugin-dialog` は入れない。`opener` と同じく Rust から呼び、自作コマンドで包む。フロントの依存もクリティカルパスの重さも増えない。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 開いているファイルの変更監視（F-EDIT-16 / N-REL-02）。
# デバウンス込みの `notify-debouncer-full` を通して使う。
# イベント駆動であり、アイドル時のポーリングを増やさないことが採用の前提。
notify = "8"
notify-debouncer-full = "0.7"

# 自動更新（F-OS-06 / ADR-0024）。`dialog` と同じく Rust 側だけに入れ、JS の `@tauri-apps/plugin-updater` は入れない。
# TLS は OS のもの（Windows は SChannel、macOS は Secure Transport）を使う。rustls より配布物が小さく、社内のプロキシが差し込むルート証明書も OS の証明書ストアから信頼される。
# `zip` は要らない。NSIS の成果物は展開せず、macOS の `.app.tar.gz` は `zip` に関係なく展開される（M10 §4.10）。
[target.'cfg(not(all(unix, not(target_os = "macos"))))'.dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }

# Linux の `native-tls` は OpenSSL を動的に読み、配布先の `libssl` の版に依存する。Linux だけ rustls にする（M10 §4.10）。
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
# タスクトレイを出せる環境かの判定（`tray.rs` / ADR-0028 §3.4）。single-instance プラグインと同じ版である。
zbus = "5"
# PDF の書き出し（`export.rs` / F-VIEW-18）。Tauri と同じ版である。
gtk = "0.18"
webkit2gtk = "2.0"

# 自分自身を端末から切り離す `setsid`（`detach.rs`）と、macOS の拡張属性の引き継ぎ（`document/atomic.rs`）。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ゴミ箱（F-NAV-11 / ADR-0020 §3.3）。Windows は `SHFileOperationW` を直接呼ぶ。
[target.'cfg(not(windows))'.dependencies]
trash = "5.2"

# Finder からの起動・Dock・アプリのメニュー・表示言語・OS の版（`macos.rs`）。tao と同じ版である。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

# 単一インスタンス化と argv 転送（ADR-0004 / F-OPEN-05）
[target.'cfg(any(target_os = "windows", target_os = "macos", all(unix, not(target_os = "macos"))))'.dependencies]
tauri-plugin-single-instance = "2"

# トレイ格納中の WebView2 サスペンド（`src/webview.rs` / ADR-0007 論点 7）。
# WARNING: wry が使っているバージョンに合わせる。
# ずれると別の COM 型として扱われ、`ICoreWebView2_3` へのキャストが実行時に失敗する。
[target.'cfg(windows)'.dependencies.webview2-com]
version = "0.39.1"

# Snap Layouts（`src/snap_layouts.rs`）。
# カスタムタイトルバーでは、最大化ボタンの位置を Windows へ自分で答える必要がある。
# tao が同じ 0.61 を既に依存に持っているため、新しい依存ツリーは増えない。
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  # `--help` の言語を OS の表示言語に合わせる（`src/cli.rs` / ADR-0026）。
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  # ユーザーの PATH の登録と解除（`src/path_env.rs` / F-OS-02）。
  "Win32_System_Registry",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

# エンコーディングの推定と変換
[dependencies.encoding_rs]
version = "0.8"

[dependencies.chardetng]
version = "1.0"

[dependencies.dunce]
version = "1"

[dependencies.thiserror]
version = "2"

[profile.release]
# 配布物のサイズ予算
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
