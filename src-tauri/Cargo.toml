[package]
name = "marxdown"
version = "0.1.0"
description = "速く開く Markdown ビューア / エディタ"
authors = ["antimacho612"]
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "marxdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: ローカル画像を asset URL 経由で表示する（F-VIEW-08 / N-SEC-05）
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
# 04.tech-stack.md §6.1 — ファイル選択ダイアログ（F-OPEN-07）。
# JS 側の `@tauri-apps/plugin-dialog` は入れない。`opener` と同じく Rust から呼び、
# 自作コマンドで包む。フロントの依存もクリティカルパスの重さも増えない。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 04.tech-stack.md §6.1 — 単一インスタンス化と argv 転送（ADR-0004 / F-OPEN-05）
[target.'cfg(any(target_os = "windows", target_os = "macos", all(unix, not(target_os = "macos"))))'.dependencies]
tauri-plugin-single-instance = "2"

# 04.tech-stack.md §6.2
[dependencies.encoding_rs]
version = "0.8"

[dependencies.chardetng]
version = "0.1"

[dependencies.dunce]
version = "1"

[dependencies.thiserror]
version = "2"

[profile.release]
# 配布物のサイズ予算（05.performance-budget.md §4.6: インストーラ 8MB / 上限 15MB）
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
