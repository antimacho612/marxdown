[package]
name = "marxdown"
version = "0.1.0"
description = "Markdown を見る・書くなら、これ一択。"
authors = ["antimacho612"]
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "marxdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: ローカル画像を asset URL 経由で表示する（F-VIEW-08 / N-SEC-05）
# tray-icon: タスクトレイ常駐（F-OS-08 / ADR-0007）。
#   `tauri-plugin-autostart` は入れない（04.tech-stack/06-rust.md §1）。
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
# ファイル選択ダイアログ（F-OPEN-07 / 04.tech-stack/06-rust.md §2）。
# JS 側の `@tauri-apps/plugin-dialog` は入れない。`opener` と同じく Rust から呼び、自作コマンドで包む。フロントの依存もクリティカルパスの重さも増えない。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 開いているファイルの変更監視（F-EDIT-16 / N-REL-02 / 04.tech-stack/06-rust.md §7）。
# デバウンス込みの `notify-debouncer-full` を通して使う。
# イベント駆動であり、アイドル時のポーリングを増やさないことが採用の前提（05.performance-budget/04-targets.md §5）。
notify = "8"
notify-debouncer-full = "0.6"

# 単一インスタンス化と argv 転送（ADR-0004 / F-OPEN-05 / 04.tech-stack/06-rust.md §1）
[target.'cfg(any(target_os = "windows", target_os = "macos", all(unix, not(target_os = "macos"))))'.dependencies]
tauri-plugin-single-instance = "2"

# トレイ格納中の WebView2 サスペンド（`src/webview.rs` / ADR-0007 論点 7）。
# WARNING: wry が使っているバージョンに合わせる（04.tech-stack/06-rust.md §8）。
# ずれると別の COM 型として扱われ、`ICoreWebView2_3` へのキャストが実行時に失敗する。
[target.'cfg(windows)'.dependencies.webview2-com]
version = "0.38.2"

# Snap Layouts（`src/snap_layouts.rs` / 04.tech-stack/06-rust.md §11）。
# カスタムタイトルバーでは、最大化ボタンの位置を Windows へ自分で答える必要がある。
# tao が同じ 0.61 を既に依存に持っているため、新しい依存ツリーは増えない。
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  # 既存インスタンスの検出（`src/instance.rs` / F-OPEN-06）。`OpenMutexW` だけを使う。
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

# エンコーディングの推定と変換（04.tech-stack/06-rust.md §7）
[dependencies.encoding_rs]
version = "0.8"

[dependencies.chardetng]
version = "0.1"

[dependencies.dunce]
version = "1"

[dependencies.thiserror]
version = "2"

[profile.release]
# 配布物のサイズ予算（05.performance-budget/04-targets.md §6）
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
