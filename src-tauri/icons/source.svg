<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Marxdown">
  <!--
    Marxdown アプリアイコンのマスター（透過版 / 64px 以下で使う）。
    台座つきの版は `source-plate.svg`。形を直すときは両方直す。骨格の座標・線幅・玉の径は 2 ファイルで同一。
    同じ形を `src/lib/Mark.svelte`（画面内）と `assets/logo-*.svg`（README）も持っている。
    生成は `pnpm icons`（`scripts/build-icons.mjs`）。手で `tauri icon` を叩かないこと。

    形の由来: マルクのジェスターハット。幾何学的な M の 2 つの山に、大きさの違う玉（鈴）が載る。
    以前は左右非対称の筆記体だったが、小サイズで letterform に見えず塊に見えたため作り替えた。
    帽子の読みは玉だけが担う。

    玉の大小は装飾ではなく必須。同径・同高の玉を左右対称に置くと 2 つの目に見え、
    M と 2 本の茎が顔と胴に読み替えられる。径に差をつけた時点でこの読みは消える。

    座標は次の導出で決まっている。手で動かさないこと。動かすなら鎖の上流から引き直す。
    φ = 1.6180340、√2 = 1.4142136、√φ = 1.2720196 とする。

      余白 m    = 256 / φ^4      = 37.3475   （字面の外側がこの位置に来る）
      字面幅 Wo = 256 - 2m       = 181.30
      字面高 Ho = Wo * √2 / φ    = 158.46    （字面の箱が φ : √2）
      線幅 w    = Wo / φ^3       = 42.80     （半幅 hw = 21.40）
      左の玉 r1 = hw * √φ        = 27.22
      右の玉 r2 = hw             = 21.40     （= r1 / √φ）

    結果として茎の芯が x=58.75 / 197.25、山の頂点が y=68.89、足の芯が y=184.55 になる。
    左の玉だけは半径が hw を超えるので字面の外へ 5.82 はみ出す。
    これは補正していない。目が中心を取るのは M の量塊のほうで、そちらは x=128 対称のまま。

    谷の尖点は x=128 の垂直線で 2 本のストロークを突き合わせて作る。
    どちらのパスも谷を越えて (158 214.33) / (98 214.33) まで伸ばし、`cw` / `ce` で半分ずつ捨てている。
    伸ばし先は x=128 から 30 離してあり、線の半幅 21.40 より大きいので丸キャップごと消える。
    線幅を変えたら伸ばし量も引き直すこと。

    V の先端は足の底（y=205.95）より 2.4 下の y=208.33 に出る。
    尖った形は丸い形と同じ高さで止めると浮いて見えるという、活字のオーバーシュートと同じ理由。

    箱の中心を y=125 に置いているのは光学補正で、幾何中心より 3px 上。
    下側に足と V の質量が集まるため、幾何中心のままだと沈んで見える。

    玉の陰影は線形グラデーションで、球体としての放射グラデーションは使わない。
    艶のある球はアイコンの見た目を古くする主因だった。光は左上から 1 方向で、
    藍・薔薇のリボンのグラデーションも同じ向きに揃えてある。片方だけ動かさないこと。

    背景は敷かない。16px で出る頻度が高く、地を敷くと実効サイズが落ちるため。
    影も落とさない。明るい地の上では灰色の汚れに見える（台座版だけが影を持つ）。
    グラデーションは 32px 以下では消えてフラットに退化するが、形は壊れない。
  -->
  <defs>
    <clipPath id="cw"><rect x="-64" y="-64" width="192" height="384" /></clipPath>
    <clipPath id="ce"><rect x="128" y="-64" width="192" height="384" /></clipPath>
    <linearGradient id="b" gradientUnits="userSpaceOnUse" x1="48" y1="54" x2="112" y2="206">
      <stop offset="0" stop-color="#8e9dff" />
      <stop offset="0.45" stop-color="#5566ee" />
      <stop offset="1" stop-color="#2f35b4" />
    </linearGradient>
    <linearGradient id="r" gradientUnits="userSpaceOnUse" x1="146" y1="62" x2="212" y2="208">
      <stop offset="0" stop-color="#ff8fa8" />
      <stop offset="0.45" stop-color="#f2506a" />
      <stop offset="1" stop-color="#b81c46" />
    </linearGradient>
    <linearGradient id="y" x1="0.14" y1="0.02" x2="0.86" y2="0.98">
      <stop offset="0" stop-color="#ffe9a3" />
      <stop offset="0.5" stop-color="#ffc44a" />
      <stop offset="1" stop-color="#e8940e" />
    </linearGradient>
  </defs>

  <!-- 台座が無いぶんマークを大きく置ける。字面から縁までの余白が 256 / φ^5 = 23.08 になる倍率。 -->
  <g transform="translate(128 125) scale(1.157) translate(-128 -125)">
    <g fill="none" stroke-width="42.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M58.75 184.55 L58.75 68.89 L158 214.33" stroke="url(#b)" clip-path="url(#cw)" />
      <path d="M197.25 184.55 L197.25 68.89 L98 214.33" stroke="url(#r)" clip-path="url(#ce)" />
    </g>

    <circle cx="58.75" cy="68.89" r="27.22" fill="url(#y)" />
    <circle cx="197.25" cy="68.89" r="21.4" fill="url(#y)" />
  </g>
</svg>
