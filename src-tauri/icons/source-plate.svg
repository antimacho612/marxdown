<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Marxdown">
  <!--
    Marxdown アプリアイコンのマスター（台座版 / 128px 以上で使う）。
    64px 以下は `source-plate-small.svg`、台座なしの版は `source.svg`。
    形を直すときは 3 ファイルとも直す。骨格の座標・線幅・玉の径は全ファイルで同一。
    骨格そのものの導出は `source.svg` のコメントを見ること。

    小サイズを別マスターに分けてあるのは、余白の比と効果の量をそのまま縮小できないため。
    理由は `source-plate-small.svg` のコメントに書いてある。境界は ICO の標準サイズに合わせて 64 / 128 の間。

    台座が squircle ではなく円なのは、squircle が Windows 11 / macOS のタイルと同じ形の言語で、
    同じ言語で並ぶぶん輪郭では見分けがつかないため。円は角の情報量が無いぶん中身のマークが立つ。
    円は squircle より面積が狭いので、そのぶんマークを 0.923 倍に縮めて余白を確保している。

    倍率 0.923 は、マークの最遠点が台座の半径から 128 / φ^4 = 18.67 内側に収まる値。
    透過版が字面の外に 256 / φ^5 の余白を取るのと同じ、φ の冪で余白を決める規則に揃えてある。
    最遠点は左の玉で、半径が最大かつ中心から最も遠い。

    地は #29304f から #070910 への対角グラデーション。マークの藍・薔薇・金と同系に振ってある。
    その上に:

      sweep: 左上からの光（白 10%）
      rim:   上縁を白 34%、下縁を白 14% で締める。暗いタスクバー上で台座の輪郭が消えるのを防ぐ

    マークの落とす影は下へ 5 / ぼかし 5 / 不透明度 0.26。これ以上強くするとスキューモーフィズムに寄る。
    玉の接地影（`cs`）は別に持たせてある。これが無いと玉が茎に貼り付いたシールに見える。

    谷の継ぎ目には薔薇側から藍側へ落ちる影（`seam`）を 12px 幅で入れてある。
    2 色が単に隣接するのではなく、薔薇のリボンが手前で重なっているという読みを作るため。
    以前あった玉の鏡面ハイライト（ぼかした楕円）と球体の放射グラデーションは落とした。
    艶のある球はアイコンの見た目を古くする主因だった。
  -->
  <defs>
    <clipPath id="cw"><rect x="-64" y="-64" width="192" height="384" /></clipPath>
    <clipPath id="ce"><rect x="128" y="-64" width="192" height="384" /></clipPath>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="26" y1="8" x2="230" y2="248">
      <stop offset="0" stop-color="#29304f" />
      <stop offset="0.5" stop-color="#141930" />
      <stop offset="1" stop-color="#070910" />
    </linearGradient>
    <radialGradient id="sweep" cx="0.3" cy="0.24" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="128" y1="0" x2="128" y2="256">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14" />
    </linearGradient>
    <linearGradient id="b" gradientUnits="userSpaceOnUse" x1="48" y1="54" x2="112" y2="206">
      <stop offset="0" stop-color="#9aa8ff" />
      <stop offset="0.45" stop-color="#5f70f5" />
      <stop offset="1" stop-color="#3540c4" />
    </linearGradient>
    <linearGradient id="r" gradientUnits="userSpaceOnUse" x1="146" y1="62" x2="212" y2="208">
      <stop offset="0" stop-color="#ff9bb1" />
      <stop offset="0.45" stop-color="#f75b74" />
      <stop offset="1" stop-color="#c72150" />
    </linearGradient>
    <linearGradient id="y" x1="0.14" y1="0.02" x2="0.86" y2="0.98">
      <stop offset="0" stop-color="#ffeaa8" />
      <stop offset="0.5" stop-color="#ffc750" />
      <stop offset="1" stop-color="#e89512" />
    </linearGradient>
    <linearGradient id="yrim" gradientUnits="userSpaceOnUse" x1="0" y1="41.67" x2="0" y2="96.11">
      <stop offset="0" stop-color="#fffaea" stop-opacity="0.45" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="seamFade" gradientUnits="userSpaceOnUse" x1="128" y1="0" x2="140" y2="0">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#000000" />
    </linearGradient>
    <mask id="seam" maskUnits="userSpaceOnUse" x="128" y="0" width="12" height="256">
      <rect x="128" y="0" width="12" height="256" fill="url(#seamFade)" />
    </mask>
    <filter id="soft" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="5" /></filter>
    <filter id="cs" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="4" /></filter>
  </defs>

  <circle cx="128" cy="128" r="128" fill="url(#bg)" />
  <circle cx="128" cy="128" r="128" fill="url(#sweep)" />
  <circle cx="128" cy="128" r="126.5" fill="none" stroke="url(#rim)" stroke-width="3" />

  <g transform="translate(128 125) scale(0.923) translate(-128 -125)">
    <g filter="url(#soft)" opacity="0.26" transform="translate(0 5)">
      <g fill="none" stroke="#000" stroke-width="42.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M58.75 184.55 L58.75 68.89 L158 214.33" clip-path="url(#cw)" />
        <path d="M197.25 184.55 L197.25 68.89 L98 214.33" clip-path="url(#ce)" />
      </g>
      <circle cx="58.75" cy="68.89" r="27.22" fill="#000" />
      <circle cx="197.25" cy="68.89" r="21.4" fill="#000" />
    </g>

    <g fill="none" stroke-width="42.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M58.75 184.55 L58.75 68.89 L158 214.33" stroke="url(#b)" clip-path="url(#cw)" />
      <path d="M197.25 184.55 L197.25 68.89 L98 214.33" stroke="url(#r)" clip-path="url(#ce)" />
    </g>
    <g mask="url(#seam)" clip-path="url(#ce)" opacity="0.3">
      <path
        d="M197.25 184.55 L197.25 68.89 L98 214.33"
        fill="none"
        stroke="#0a0a1e"
        stroke-width="42.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>

    <circle cx="58.75" cy="72.89" r="27.22" fill="#000" opacity="0.28" filter="url(#cs)" />
    <circle cx="58.75" cy="68.89" r="27.22" fill="url(#y)" />
    <circle cx="58.75" cy="68.89" r="27.22" fill="none" stroke="url(#yrim)" stroke-width="1.4" />

    <circle cx="197.25" cy="72.89" r="21.4" fill="#000" opacity="0.28" filter="url(#cs)" />
    <circle cx="197.25" cy="68.89" r="21.4" fill="url(#y)" />
    <circle cx="197.25" cy="68.89" r="21.4" fill="none" stroke="url(#yrim)" stroke-width="1.4" />
  </g>
</svg>
